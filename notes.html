<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daily study notes and PDF material for Nishtha Institute students.">
    <title>Daily Notes | Nishtha Institute</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #173b70;
            color: #fff;
            padding: 28px 20px;
        }

        .header-inner,
        main {
            max-width: 1100px;
            margin: auto;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #dbeafe;
        }

        main {
            padding: 28px 16px 50px;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        .results {
            margin-bottom: 16px;
            color: #64748b;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .note-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px #00000008;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 0;
        }

        .tag {
            background: #eaf1ff;
            color: #214f9a;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .note-card h2 {
            font-size: 19px;
            margin: 0 0 12px;
            overflow-wrap: anywhere;
        }

        .meta {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
            margin: 0 0 18px;
        }

        .download {
            display: inline-block;
            margin-top: auto;
            padding: 11px 15px;
            background: #1d4ed8;
            color: white;
            border-radius: 7px;
            text-decoration: none;
            font-weight: 600;
        }

        .download:hover {
            background: #173b70;
        }

        .message {
            padding: 24px;
            background: white;
            border-radius: 10px;
            color: #64748b;
            text-align: center;
            grid-column: 1 / -1;
        }

        @media (max-width: 800px) {
            .notes-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .filters {
                grid-template-columns: 1fr 1fr;
            }

            .filters input {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 520px) {

            .notes-grid,
            .filters {
                grid-template-columns: 1fr;
            }

            .filters input {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <h1>Nishtha Institute — Daily Notes</h1>
            <p>Find your daily study material and download PDFs.</p>
        </div>
    </header>

    <main>
        <section class="filters" aria-label="Filter notes">
            <input id="searchInput" type="search" placeholder="Search notes or subject..." aria-label="Search notes">

            <select id="courseFilter" aria-label="Filter by course">
                <option value="">All Courses</option>
            </select>

            <select id="subjectFilter" aria-label="Filter by subject">
                <option value="">All Subjects</option>
            </select>
        </section>

        <p id="resultsCount" class="results" aria-live="polite">
            Loading notes...
        </p>

        <section id="notesGrid" class="notes-grid" aria-label="Published notes">
            <p class="message">Loading study material...</p>
        </section>
    </main>

    <script type="module" src="./notes.js"></script>
</body>

</html>
